[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igrapiweb"
version = "1.0.0"
description = "A pure-Python Instagram Web client — no browser, no emulator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ashsawtech" }]
keywords = ["instagram", "web", "client", "realtime", "direct-messages"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests[socks]>=2.28",
    "websocket-client>=1.5",
    "python-socks>=2.0",
]

[project.optional-dependencies]
# Voice/video calls (WebRTC signaling + media).
calls = ["aiortc==1.15.0", "aioice==0.10.2"]
# Pure-web credential login and session recovery.
login = ["curl_cffi>=0.6", "pynacl>=1.5", "cryptography>=41"]
all = ["aiortc==1.15.0", "aioice==0.10.2", "curl_cffi>=0.6", "pynacl>=1.5", "cryptography>=41"]

[project.urls]
Homepage = "https://github.com/ashsawtech/igrapiweb"
Source = "https://github.com/ashsawtech/igrapiweb"

[tool.setuptools.packages.find]
include = ["igrapiweb*"]

[tool.setuptools.package-data]
igrapiweb = ["call/templates/*.bin"]
